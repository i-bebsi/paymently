server:
  port: 8081

payment:
  api:
    base-url: https://payment.uii.ac.id
    access-token-path: /v1.0/access-token/b2b/
    inquiry-path: /v2/bill/inquiry
    payment-path: /v2/bill/payment
    healthz-path: /v2/bill/healthz
    connect-timeout: 10s
    read-timeout: 20s
  auth:
    client-key: ${PAYMENT_CLIENT_KEY:isi_dengan_client_key}
    channel-id: ${PAYMENT_CHANNEL_ID:isi_dengan_channel_id}
    partner-id: ${PAYMENT_PARTNER_ID:isi_dengan_partner_id}
    external-id: ${PAYMENT_EXTERNAL_ID:isi_dengan_external_id}
    signature: ${PAYMENT_SIGNATURE:isi_dengan_signature}
    timestamp: ${PAYMENT_AUTH_TIMESTAMP:2026-07-14T15:44:00+07:00}

logging:
  level:
    com.uii.paymently: DEBUG
    org.apache.http: INFO
